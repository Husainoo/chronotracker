# Render Blueprint — ChronoTracker
# الأسرار (APP_PASSWORD, TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY, ALLOWED_USER_IDS)
# تُدخل من لوحة تحكم Render (sync: false) — لا تُكتب هنا.
services:
  # ====== تطبيق التسعير (Web Service)
  - type: web
    name: chronotracker-web
    runtime: python
    # starter (مطابق للترقية اليدوية في اللوحة) — لو بقيت free هنا، كل مزامنة
    # Blueprint تطلق "Instance type updated" وتعيد النشر وتنزّل الخطة.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # gunicorn بدل خادم http.server أحادي الخيط: عامل واحد (حفاظاً على الذاكرة؛
    # المحرك يُحمَّل مرة في الـ master مع --preload) + 4 خيوط حتى لا يجمّد
    # طلب بطيء فحص Render الصحي. التطبيق يصدّر WSGI app (محوّل فوق المعالج).
    startCommand: gunicorn pricing_app_cloud:app --workers 1 --threads 4 --timeout 120 --preload --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_PASSWORD
        sync: false        # أدخلها في لوحة Render
      - key: CSV_PATH
        value: chronotracker_complete_v2.csv
      - key: DISC_CSV
        value: discontinued_rolex.csv
      - key: IMAGES_PATH
        value: images
    # ملاحظة: Render يضبط PORT تلقائياً والتطبيق يقرأه من البيئة.

  # ====== بوت تلقرام (Background Worker — دائم التشغيل، مدفوع)
  - type: worker
    name: chronotracker-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: CSV_PATH
        value: chronotracker_complete_v2.csv
      - key: DISC_CSV
        value: discontinued_rolex.csv
