# Render Blueprint — ChronoTracker
# الأسرار (APP_PASSWORD, TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY, ALLOWED_USER_IDS)
# تُدخل من لوحة تحكم Render (sync: false) — لا تُكتب هنا.
services:
  # ====== تطبيق التسعير (Web Service)
  - type: web
    name: chronotracker-web
    runtime: python
    # starter (مطابق للترقية اليدوية في اللوحة) — لو بقيت free هنا، كل مزامنة
    # Blueprint تطلق "Instance type updated" وتعيد النشر وتنزّل الخطة.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # gunicorn بدل خادم http.server أحادي الخيط: عامل واحد (حفاظاً على الذاكرة؛
    # المحرك يُحمَّل مرة في الـ master مع --preload) + 4 خيوط حتى لا يجمّد
    # طلب بطيء فحص Render الصحي. التطبيق يصدّر WSGI app (محوّل فوق المعالج).
    startCommand: gunicorn pricing_app_cloud:app --workers 1 --threads 4 --timeout 120 --preload --bind 0.0.0.0:$PORT
    # قرص دائم للمفضّلة: نظام ملفات Render مؤقت ويُعاد بناؤه من git مع كل نشر
    # (يومياً مع تحديث البيانات) — أي مفضّلة تُضاف من الموقع كانت تُمسح.
    # القرص يبقى عبر عمليات النشر وإعادة التشغيل. (1GB ≈ $0.25/شهر؛ يعطّل
    # النشر بدون توقّف — انقطاع ثوانٍ عند كل نشر، مقبول.)
    disk:
      name: chronotracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_PASSWORD
        sync: false        # أدخلها في لوحة Render
      - key: FAVORITES_PATH
        value: /var/data/favorites.json
      - key: CSV_PATH
        value: chronotracker_complete_v2.csv
      - key: DISC_CSV
        value: discontinued_rolex.csv
      - key: IMAGES_PATH
        value: images
    # ملاحظة: Render يضبط PORT تلقائياً والتطبيق يقرأه من البيئة.

  # ====== بوت تلقرام (Background Worker — دائم التشغيل، مدفوع)
  - type: worker
    name: chronotracker-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    # قرص دائم لحالة تنبيه المفضّلة (favorites_alerts.json) — حتى لا تتكرر
    # التنبيهات بعد كل إعادة نشر (نظام الملفات مؤقت). قرص منفصل عن قرص الويب:
    # الأقراص لا تُشارَك بين الخدمات، لذا يجلب البوت المفضّلة عبر واجهة الموقع.
    disk:
      name: chronotracker-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: CSV_PATH
        value: chronotracker_complete_v2.csv
      - key: DISC_CSV
        value: discontinued_rolex.csv
      # تنبيه المفضّلة اليومي: يجلب المفضّلة من خدمة الويب بنفس كلمة سر الموقع
      - key: APP_PASSWORD
        sync: false        # نفس قيمة APP_PASSWORD في chronotracker-web
      - key: WEB_HOST
        fromService:
          type: web
          name: chronotracker-web
          property: host
      - key: BOT_DATA_DIR
        value: /var/data
      - key: ALERT_TZ
        value: Asia/Kuwait
      - key: ALERT_HOUR
        value: "19"
